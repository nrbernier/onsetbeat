name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check of the page script
        run: node -e "const s=require('fs').readFileSync('index.html','utf8');const a=s.indexOf('<script>')+8;new Function(s.slice(a,s.indexOf('</script>',a)))"
      - name: Analysis and chart tests
        run: node --test tests/*.test.js
