<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300">
<rect width="860" height="300" rx="14" fill="#16132b"/>
<text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f2f0ff" text-anchor="start" font-weight="700">Straight or triplet: which grid do the off-beat onsets sit on?</text><text x="24" y="115" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#f2f0ff" text-anchor="start" font-weight="700">Straight (÷4)</text><line x1="200" x2="820" y1="110" y2="110" stroke="#3a3466" stroke-width="2"/><line x1="200" x2="200" y1="84" y2="136" stroke="#f2f0ff" stroke-opacity="0.5" stroke-width="2"/><line x1="510" x2="510" y1="84" y2="136" stroke="#f2f0ff" stroke-opacity="0.5" stroke-width="2"/><line x1="820" x2="820" y1="84" y2="136" stroke="#f2f0ff" stroke-opacity="0.5" stroke-width="2"/><line x1="277.5" x2="277.5" y1="98" y2="122" stroke="#f2f0ff" stroke-width="3"/><line x1="355" x2="355" y1="98" y2="122" stroke="#f2f0ff" stroke-width="3"/><line x1="432.5" x2="432.5" y1="98" y2="122" stroke="#f2f0ff" stroke-width="3"/><line x1="587.5" x2="587.5" y1="98" y2="122" stroke="#f2f0ff" stroke-width="3"/><line x1="665" x2="665" y1="98" y2="122" stroke="#f2f0ff" stroke-width="3"/><line x1="742.5" x2="742.5" y1="98" y2="122" stroke="#f2f0ff" stroke-width="3"/><circle cx="200" cy="76" r="6" fill="#ff5a76"/><line x1="200" x2="200" y1="82" y2="96" stroke="#ff5a76" stroke-dasharray="2 2"/><circle cx="355" cy="76" r="6" fill="#ff5a76"/><line x1="355" x2="355" y1="82" y2="96" stroke="#ff5a76" stroke-dasharray="2 2"/><circle cx="510" cy="76" r="6" fill="#ff5a76"/><line x1="510" x2="510" y1="82" y2="96" stroke="#ff5a76" stroke-dasharray="2 2"/><circle cx="665" cy="76" r="6" fill="#ff5a76"/><line x1="665" x2="665" y1="82" y2="96" stroke="#ff5a76" stroke-dasharray="2 2"/><text x="200" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#aba6d4" text-anchor="start">Onsets land on 1/2: they fit the quarter grid exactly, the thirds miss by 1/6 of a beat.</text><text x="24" y="225" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#f2f0ff" text-anchor="start" font-weight="700">Swing (÷3)</text><line x1="200" x2="820" y1="220" y2="220" stroke="#3a3466" stroke-width="2"/><line x1="200" x2="200" y1="194" y2="246" stroke="#f2f0ff" stroke-opacity="0.5" stroke-width="2"/><line x1="510" x2="510" y1="194" y2="246" stroke="#f2f0ff" stroke-opacity="0.5" stroke-width="2"/><line x1="820" x2="820" y1="194" y2="246" stroke="#f2f0ff" stroke-opacity="0.5" stroke-width="2"/><line x1="303.3333333333333" x2="303.3333333333333" y1="208" y2="232" stroke="#5fe3a9" stroke-width="3"/><line x1="406.66666666666663" x2="406.66666666666663" y1="208" y2="232" stroke="#5fe3a9" stroke-width="3"/><line x1="613.3333333333333" x2="613.3333333333333" y1="208" y2="232" stroke="#5fe3a9" stroke-width="3"/><line x1="716.6666666666666" x2="716.6666666666666" y1="208" y2="232" stroke="#5fe3a9" stroke-width="3"/><circle cx="200" cy="186" r="6" fill="#ff5a76"/><line x1="200" x2="200" y1="192" y2="206" stroke="#ff5a76" stroke-dasharray="2 2"/><circle cx="406.66666666666663" cy="186" r="6" fill="#ff5a76"/><line x1="406.66666666666663" x2="406.66666666666663" y1="192" y2="206" stroke="#ff5a76" stroke-dasharray="2 2"/><circle cx="510" cy="186" r="6" fill="#ff5a76"/><line x1="510" x2="510" y1="192" y2="206" stroke="#ff5a76" stroke-dasharray="2 2"/><circle cx="716.6666666666666" cy="186" r="6" fill="#ff5a76"/><line x1="716.6666666666666" x2="716.6666666666666" y1="192" y2="206" stroke="#ff5a76" stroke-dasharray="2 2"/><text x="200" y="262" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#aba6d4" text-anchor="start">Onsets land on 2/3: thirds fit exactly, quarters miss by 1/12. Weighted by onset strength over ±3 beats.</text><text x="24" y="286" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="start">On a synthetic swing track, 100% of beats are given the triplet grid; on straight tracks, 0%.</text>
</svg>
