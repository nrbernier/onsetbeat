<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" width="860" height="300">
<rect width="860" height="300" rx="14" fill="#16132b"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#aba6d4"/></marker></defs><text x="24" y="32" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#f2f0ff" text-anchor="start" font-weight="700">From audio file to chart</text><rect x="24" y="56" width="150" height="84" rx="10" fill="#1f1b3b" stroke="#aba6d4" stroke-width="2"/><text x="99" y="80" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f2f0ff" text-anchor="middle" font-weight="700">Audio</text><text x="99" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">mono, 11 kHz</text><text x="99" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">46 ms frames</text><text x="99" y="132" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">every 11.6 ms</text><rect x="214" y="56" width="170" height="84" rx="10" fill="#1f1b3b" stroke="#4cc6ff" stroke-width="2"/><text x="299" y="80" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f2f0ff" text-anchor="middle" font-weight="700">Spectral flux</text><text x="299" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">40 mel bands</text><text x="299" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">rise in loudness</text><text x="299" y="132" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">per band, summed</text><rect x="424" y="56" width="170" height="84" rx="10" fill="#1f1b3b" stroke="#ff5a76" stroke-width="2"/><text x="509" y="80" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f2f0ff" text-anchor="middle" font-weight="700">Onsets</text><text x="509" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">local peaks above</text><text x="509" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">a moving threshold</text><rect x="214" y="186" width="170" height="90" rx="10" fill="#1f1b3b" stroke="#ffc94a" stroke-width="2"/><text x="299" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f2f0ff" text-anchor="middle" font-weight="700">Tempo path</text><text x="299" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">8 s autocorrelation</text><text x="299" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">windows, joined by</text><text x="299" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">Viterbi</text><rect x="424" y="186" width="170" height="90" rx="10" fill="#1f1b3b" stroke="#ffc94a" stroke-width="2"/><text x="509" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f2f0ff" text-anchor="middle" font-weight="700">Beats</text><text x="509" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">dynamic programming</text><text x="509" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">using the local</text><text x="509" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">tempo</text><rect x="634" y="186" width="200" height="90" rx="10" fill="#1f1b3b" stroke="#5fe3a9" stroke-width="2"/><text x="734" y="210" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f2f0ff" text-anchor="middle" font-weight="700">Grid and bars</text><text x="734" y="230" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">each beat in 4 or 3</text><text x="734" y="246" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">meter 3, 4, 5 or 7</text><text x="734" y="262" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">per section</text><rect x="634" y="56" width="200" height="84" rx="10" fill="#1f1b3b" stroke="#ffc94a" stroke-width="2"/><text x="734" y="80" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f2f0ff" text-anchor="middle" font-weight="700">Chart</text><text x="734" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">pick strongest grid</text><text x="734" y="116" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">points → tap, phrase,</text><text x="734" y="132" font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#aba6d4" text-anchor="middle">spin → place on field</text><path d="M174 98 L212 98" stroke="#aba6d4" stroke-width="2" marker-end="url(#a)"/><path d="M384 98 L422 98" stroke="#aba6d4" stroke-width="2" marker-end="url(#a)"/><path d="M299 140 L299 184" stroke="#aba6d4" stroke-width="2" marker-end="url(#a)"/><path d="M384 231 L422 231" stroke="#aba6d4" stroke-width="2" marker-end="url(#a)"/><path d="M594 231 L632 231" stroke="#aba6d4" stroke-width="2" marker-end="url(#a)"/><path d="M594 98 L632 98" stroke="#aba6d4" stroke-width="2" marker-end="url(#a)"/><path d="M734 186 L734 142" stroke="#aba6d4" stroke-width="2" marker-end="url(#a)"/>
</svg>
